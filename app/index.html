<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Home</title>
<meta name="viewport" content="width=1920, height=1080">
<!-- No network access at all: the page can load itself and nothing else. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; connect-src 'none'; img-src 'self' data:; frame-src 'none'; object-src 'none'">
<style>
/* Written for Chromium 69 (Tizen 5.5): no inset, no flex gap, no clamp(),
   no aspect-ratio, no backdrop-filter. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0c10;
  font-family:"SamsungOne","Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
#bg{position:absolute;left:0;top:0;width:1920px;height:1080px;
  background:#1a1d2e;transition:background-color 900ms ease}
#bg i{position:absolute;left:0;top:0;width:1920px;height:1080px}
#bg .tint{background:linear-gradient(160deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 55%)}
#bg .vig{background:radial-gradient(ellipse at 30% 20%,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 100%)}
#bg .floor{top:500px;height:580px;background:linear-gradient(180deg,rgba(6,7,10,0) 0%,rgba(6,7,10,.82) 100%)}

#clock{position:absolute;left:160px;top:84px;font-size:64px;font-weight:300;letter-spacing:1px}
#date{position:absolute;left:162px;top:164px;font-size:26px;font-weight:400;opacity:.62;letter-spacing:.5px}

#hero{position:absolute;left:160px;top:300px;width:1400px}
#heroName{font-size:104px;font-weight:700;letter-spacing:-1px;line-height:1.05;
  text-shadow:0 4px 40px rgba(0,0,0,.45)}
#heroSub{margin-top:18px;font-size:30px;opacity:.7;font-weight:400}

.rowLabel{position:absolute;left:160px;font-size:22px;letter-spacing:3px;opacity:.5;text-transform:uppercase}
.row{position:absolute;left:160px;white-space:nowrap;
  transition:transform 380ms cubic-bezier(.2,.8,.2,1)}
.tile{position:relative;display:inline-block;vertical-align:top;margin-right:34px;border-radius:22px;
  overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);
  transition:transform 260ms cubic-bezier(.2,.8,.2,1),box-shadow 260ms ease,opacity 260ms ease;
  opacity:.82}
.tile .name{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;
  align-items:center;justify-content:center;text-align:center;padding:0 18px;
  font-weight:700;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.tile .shine{position:absolute;left:0;top:0;width:100%;height:100%;
  background:linear-gradient(135deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 46%);opacity:.55;
  transition:opacity 260ms ease}
.tile.focus{transform:scale(1.13) translateY(-10px);opacity:1;
  box-shadow:0 34px 70px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.92)}
.tile.focus .shine{opacity:1}
.r0 .tile{width:300px;height:170px}.r0 .tile .name{font-size:36px}
.r1 .tile{width:200px;height:113px;border-radius:16px}.r1 .tile .name{font-size:24px}

#hint{position:absolute;left:160px;bottom:48px;font-size:20px;opacity:.38;letter-spacing:.5px}
#toast{position:absolute;left:0;bottom:120px;width:1920px;text-align:center;font-size:28px;
  opacity:0;transition:opacity 250ms ease}
#toast span{display:inline-block;background:rgba(0,0,0,.72);padding:14px 30px;border-radius:40px}
#toast.on{opacity:1}
#dbg{display:none;position:absolute;left:100px;top:60px;width:1720px;height:960px;
  background:rgba(8,9,12,.96);border-radius:24px;padding:36px 48px;font-size:22px;line-height:1.5;overflow:hidden}
#dbg h2{font-size:30px;margin-bottom:14px}
#dbg .cols{column-count:2;column-gap:48px}
#dbg div.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
#dbg b{color:#7fd1ff;font-weight:400}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><i class="tint"></i><i class="vig"></i><i class="floor"></i></div>
  <div id="clock"></div><div id="date"></div>
  <div id="hero"><div id="heroName"></div><div id="heroSub"></div></div>
  <div class="rowLabel" style="top:558px" id="lab0"></div>
  <div class="row r0" id="row0" style="top:640px"></div>
  <div class="rowLabel" style="top:870px" id="lab1"></div>
  <div class="row r1" id="row1" style="top:912px"></div>
  <div id="hint">OK open &nbsp;·&nbsp; arrows move &nbsp;·&nbsp; yellow = app list</div>
  <div id="toast"><span id="toastT"></span></div>
  <div id="dbg"><h2>Installed apps</h2><div class="cols" id="dbgList"></div></div>
</div>

<script src="apps.js"></script>
<script>
(function(){
'use strict';

/* ---------- data ---------- */
var STATIC = (window.TV_APPS || []).slice();

// Favourites, in this order, matched on app name. Edit freely.
var FAVS = [/^youtube$/i,/netflix/i,/disney/i,/\bmax\b|hbo/i,/prime/i,/apple\s*tv/i,
            /^tv\s*2|tv2/i,/nrk/i,/viaplay/i,/spotify/i,/plex/i,/jellyfin/i];

// Tile colours (name regex -> [from, to]). Anything else gets a stable colour from its name.
var COLORS = [
 [/youtube/i,['#ff3b30','#a3110b']],[/netflix/i,['#e50914','#6b0309']],
 [/disney/i,['#1f4fd8','#0a1f6b']],[/\bmax\b|hbo/i,['#6a2cff','#2a0d7a']],
 [/prime/i,['#14a8e0','#0a5d85']],[/apple/i,['#5b5f69','#1c1d22']],
 [/spotify/i,['#1ed760','#0b6a2f']],[/plex/i,['#f5b014','#8a5a00']],
 [/nrk/i,['#1470e0','#093e86']],[/tv\s*2|tv2/i,['#ff2d8a','#7a0c43']],
 [/viaplay/i,['#7a1fe0','#2d0b66']],[/jellyfin/i,['#8f4de6','#2b86c6']],
 [/browser|internet/i,['#2e7dff','#133a8c']],[/settings|innstill/i,['#6e7681','#2b2f36']]
];
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return Math.abs(h)}
function colorFor(n){
  for(var i=0;i<COLORS.length;i++){if(COLORS[i][0].test(n))return COLORS[i][1]}
  var h=hash(n)%360;return ['hsl('+h+',62%,46%)','hsl('+((h+28)%360)+',66%,22%)']
}

/* ---------- build lists ---------- */
var apps = STATIC.map(function(a){return {id:a.appId||a.id,name:a.name||String(a.appId||a.id)}});
var seen = {};apps = apps.filter(function(a){if(!a.id||seen[a.id])return false;seen[a.id]=1;return true});
// Hide system/noise entries you never want on a home screen.
var HIDE = [/^TizenBrew$/i,/^Home$/i,/^LauncherSetup$/i];
function visible(a){return !HIDE.some(function(r){return r.test(a.name)})}

function build(){
  var all = apps.filter(visible).sort(function(a,b){return a.name.localeCompare(b.name)});
  var fav = [],used = {};
  FAVS.forEach(function(r){all.forEach(function(a){if(!used[a.id]&&r.test(a.name)){fav.push(a);used[a.id]=1}})});
  var rest = all.filter(function(a){return !used[a.id]});
  return [fav,rest];
}

/* ---------- render ---------- */
var rows=[],pos=[0,0],cur=0;
function el(id){return document.getElementById(id)}
function render(){
  rows = build();
  if(!rows[0].length){rows=[rows[1],[]]}           // nothing matched -> everything in row 1
  for(var r=0;r<2;r++){
    var host = el('row'+r);host.innerHTML='';
    rows[r].forEach(function(a,i){
      var c=colorFor(a.name),t=document.createElement('div');
      t.className='tile';t.style.background='linear-gradient(145deg,'+c[0]+','+c[1]+')';
      t.innerHTML='<div class="name"></div><div class="shine"></div>';
      t.firstChild.textContent=a.name;
      if(a.name.length>11)t.firstChild.style.fontSize=(r?19:28)+'px';
      host.appendChild(t);a.el=t;
    });
  }
  el('lab0').textContent = rows[0].length ? 'Favourites' : '';
  el('lab1').textContent = rows[1].length ? 'All apps' : '';
  cur = rows[0].length?0:1;pos=[0,0];focus(true);
}
function focus(first){
  var list=rows[cur]; if(!list||!list.length)return;
  for(var r=0;r<2;r++)rows[r].forEach(function(a){a.el.classList.remove('focus')});
  var a=list[pos[cur]];a.el.classList.add('focus');
  var host=el('row'+cur),left=a.el.offsetLeft;
  host.style.transform='translateX('+(-Math.max(0,left-620))+'px)';
  var other=cur?0:1; el('row'+other).style.transform = 'translateX('+(-Math.max(0,(rows[other][pos[other]]?rows[other][pos[other]].el.offsetLeft:0)-620))+'px)';
  el('heroName').textContent=a.name;
  el('heroSub').textContent=cur?'':'Press OK to open';
  el('bg').style.backgroundColor=colorFor(a.name)[1];
}

/* ---------- actions ---------- */
var toastTimer;
function toast(t){el('toastT').textContent=t;el('toast').className='on';clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el('toast').className=''},3200)}
function launch(a){
  try{
    if(window.tizen&&tizen.application&&tizen.application.launch){
      tizen.application.launch(a.id,function(){},function(e){toast('Could not open '+a.name+' ('+(e&&e.message||'error')+')')});
    }else toast('Not running on a TV – would open '+a.name);
  }catch(e){toast('Could not open '+a.name+' ('+(e&&e.message||e)+')')}
}
function showDbg(on){
  var d=el('dbg');d.style.display=on?'block':'none';if(!on)return;
  var h='';apps.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).forEach(function(a){
    h+='<div class="l">'+a.name.replace(/</g,'&lt;')+'  <b>'+a.id+'</b></div>'});
  el('dbgList').innerHTML=h||'<div class="l">No apps known. (Run the app-list refresh, see README.)</div>';
}

/* ---------- keys ---------- */
try{ if(window.tizen&&tizen.tvinputdevice){['ColorF2Yellow','ColorF0Red','MediaPlayPause'].forEach(function(k){try{tizen.tvinputdevice.registerKey(k)}catch(e){}})} }catch(e){}
addEventListener('keydown',function(e){
  var k=e.keyCode;
  if(el('dbg').style.display==='block'){ if(k===10009||k===405||k===68||k===13){showDbg(false)} e.preventDefault();return }
  if(k===37){ if(pos[cur]>0){pos[cur]--;focus()} }
  else if(k===39){ if(pos[cur]<rows[cur].length-1){pos[cur]++;focus()} }
  else if(k===38){ if(cur===1&&rows[0].length){cur=0;pos[0]=Math.min(Math.round(pos[1]*rows[0].length/Math.max(1,rows[1].length)),rows[0].length-1);focus()} }
  else if(k===40){ if(cur===0&&rows[1].length){cur=1;pos[1]=Math.min(Math.round(pos[0]*rows[1].length/Math.max(1,rows[0].length)),rows[1].length-1);focus()} }
  else if(k===13){ var l=rows[cur];if(l&&l[pos[cur]])launch(l[pos[cur]]) }
  else if(k===405||k===68){ showDbg(true) }
  else if(k===10009){ try{tizen.application.getCurrentApplication().exit()}catch(x){} }
  else return;
  e.preventDefault();
});

/* ---------- clock + scale ---------- */
var DAYS=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
var MONTHS=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
function tick(){var d=new Date();function p(n){return n<10?'0'+n:n}
  el('clock').textContent=p(d.getHours())+':'+p(d.getMinutes());
  el('date').textContent=DAYS[d.getDay()]+' '+d.getDate()+'. '+MONTHS[d.getMonth()]}
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080),st=el('stage');
  st.style.transform='translate('+((innerWidth-1920*s)/2)+'px,'+((innerHeight-1080*s)/2)+'px) scale('+s+')'}
addEventListener('resize',fit);fit();tick();setInterval(tick,15000);

/* ---------- optional live discovery (adds apps the static list lacks) ---------- */
try{
  if(window.tizen&&tizen.application&&tizen.application.getAppsInfo){
    tizen.application.getAppsInfo(function(list){
      var have={};apps.forEach(function(a){have[a.id]=1});var added=false;
      list.forEach(function(i){if(i.id&&!have[i.id]){apps.push({id:i.id,name:i.name||i.id});added=true}});
      if(added)render();
    },function(){});
  }
}catch(e){}

render();
})();
</script>
</body>
</html>
